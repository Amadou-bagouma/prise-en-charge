<div class="pec-ecran">
  <div class="pec-titre-ecran">
    <h1 id="page-heading" data-cy="RegionHeading" jhiTranslate="peccnssApp.region.home.title">Régions</h1>
    <!-- Le nombre fait partie du titre : c'est ce qu'on vient verifier sur un referentiel. -->
    <span class="pec-muted">{{ totalItems() }} région{{ totalItems() > 1 ? 's' : '' }}</span>
  </div>

  <jhi-alert-error />
  <jhi-alert />

  <div class="pec-filtres">
    <!-- Recherche à gauche, filtres au centre, actions à droite : même disposition partout. -->
    <div class="pec-filtres__rech">
      <span class="pec-filtres__loupe"><fa-icon icon="search" /></span>
      <input
        type="search"
        class="pec-champ__ctrl"
        placeholder="Nom de la région"
        aria-label="Rechercher une région par son nom"
        data-cy="searchInput"
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
        (keyup.enter)="search()"
      />
    </div>

    <jhi-filter [filters]="filters" />

    <div class="pec-filtres__actions">
      <button type="button" class="pec-btn pec-btn--discret pec-btn--sm" (click)="load()" [disabled]="isLoading()" data-cy="actualiser">
        <fa-icon class="pec-btn__ico" icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span jhiTranslate="peccnssApp.region.home.refreshListLabel">Actualiser</span>
      </button>

      <button
        type="button"
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="pec-btn pec-btn--primaire pec-btn--sm"
        [routerLink]="['/region/new']"
      >
        <fa-icon class="pec-btn__ico" icon="plus" />
        <span jhiTranslate="peccnssApp.region.home.createLabel">Créer une région</span>
      </button>
    </div>
  </div>

  <div class="pec-panneau">
    <div class="pec-tbl-zone" id="entities">
      <table class="pec-tbl" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="nom">
              <div class="d-flex">
                <span jhiTranslate="peccnssApp.region.nom">Nom</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" class="pec-tbl__droite"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          @for (region of regions(); track trackId(region)) {
            <tr data-cy="entityTable">
              <td>
                <a class="pec-strong" [routerLink]="['/region', region.id, 'view']">{{ region.nom }}</a>
              </td>
              <td class="pec-tbl__droite">
                <div ngbDropdown container="body" class="d-inline-block">
                  <button type="button" class="pec-btn pec-btn--discret pec-btn--sm" ngbDropdownToggle data-cy="entityActionsButton">
                    <span jhiTranslate="entity.action.actions">Actions</span>
                  </button>
                  <div ngbDropdownMenu>
                    <a ngbDropdownItem [routerLink]="['/region', region.id, 'view']" data-cy="entityDetailsButton">
                      <fa-icon icon="eye" class="me-1" />
                      <span jhiTranslate="entity.action.view">Voir</span>
                    </a>
                    <a ngbDropdownItem [routerLink]="['/region', region.id, 'edit']" data-cy="entityEditButton">
                      <fa-icon icon="pencil-alt" class="me-1" />
                      <span jhiTranslate="entity.action.edit">Editer</span>
                    </a>
                    <button ngbDropdownItem type="button" (click)="delete(region)" data-cy="entityDeleteButton">
                      <fa-icon icon="times" class="me-1" />
                      <span jhiTranslate="entity.action.delete">Supprimer</span>
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="pec-tbl__vide">
                <span jhiTranslate="peccnssApp.region.home.notFound">Aucune région</span>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    @if (regions().length > 0) {
      <div class="pec-pied">
        <jhi-item-count [params]="{ page: page(), totalItems: totalItems(), itemsPerPage: itemsPerPage() }" />

        <ngb-pagination
          [collectionSize]="totalItems()"
          [page]="page()"
          [pageSize]="itemsPerPage()"
          [maxSize]="5"
          [rotate]="true"
          [boundaryLinks]="true"
          (pageChange)="navigateToPage($event)"
        />
      </div>
    }
  </div>
</div>
