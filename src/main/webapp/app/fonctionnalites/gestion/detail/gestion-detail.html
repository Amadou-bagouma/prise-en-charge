<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (gestion(); as gestionRef) {
      <div class="jhi-form-panel">
        <h2 data-cy="gestionDetailsHeading"><span jhiTranslate="peccnssApp.gestion.detail.title">Gestion</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ gestionRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="peccnssApp.gestion.nom">Nom</span></dt>
          <dd>
            <span>{{ gestionRef.nom }}</span>
          </dd>
          <dt><span jhiTranslate="peccnssApp.gestion.type">Type</span></dt>
          <dd>
            <span
              class="jhi-badge"
              [ngClass]="'jhi-badge-type-' + gestionRef.type"
              [jhiTranslate]="'peccnssApp.TypeGestion.' + (gestionRef.type ?? 'null')"
              >{{ { null: '', AS: 'AS', OA: 'OA' }[gestionRef.type ?? 'null'] }}</span
            >
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/gestion', gestionRef.id, 'edit']" class="btn btn-accent">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
