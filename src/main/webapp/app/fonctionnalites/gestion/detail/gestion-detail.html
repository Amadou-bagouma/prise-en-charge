@if (gestion(); as gestionRef) {
  <div class="pec-ecran">
    <div class="pec-titre-ecran">
      <h1 data-cy="gestionDetailsHeading">{{ gestionRef.nom }}</h1>
    </div>

    <jhi-alert-error />
    <jhi-alert />

    <section class="pec-panneau">
      <div class="pec-panneau__tete">
        <span class="pec-panneau__titre">Gestion</span>
      </div>
      <div class="pec-panneau__corps">
        <dl class="pec-defs">
          <dt>Nom</dt>
          <dd>{{ gestionRef.nom || '—' }}</dd>

          <dt>Type</dt>
          <dd>
            <span class="pec-badge pec-badge--info">
              <span class="pec-badge__pt"></span>
              <span [jhiTranslate]="'peccnssApp.TypeGestion.' + (gestionRef.type ?? 'null')">{{ gestionRef.type }}</span>
            </span>
          </dd>
        </dl>
      </div>
    </section>

    <div class="pec-dossier__actions">
      <button type="button" [routerLink]="['/gestion', gestionRef.id, 'edit']" class="pec-btn pec-btn--primaire" data-cy="entityEditButton">
        <fa-icon class="pec-btn__ico" icon="pencil-alt" />
        <span jhiTranslate="entity.action.edit">Editer</span>
      </button>

      <button
        type="button"
        (click)="previousState()"
        class="pec-btn pec-btn--discret pec-dossier__actions--fin"
        data-cy="entityDetailsBackButton"
      >
        <fa-icon class="pec-btn__ico" icon="arrow-left" />
        <span jhiTranslate="entity.action.back">Retour</span>
      </button>
    </div>
  </div>
}
