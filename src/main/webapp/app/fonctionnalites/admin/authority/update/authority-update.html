<div class="d-flex justify-content-center">
  <div class="col-12 col-xl-5">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm" class="jhi-form-panel">
      <h2 id="jhi-authority-heading" data-cy="AuthorityCreateUpdateHeading" jhiTranslate="peccnssApp.adminAuthority.home.createOrEditLabel">
        Create or edit a Authority
      </h2>

      <jhi-alert-error />

      @let nameRef = editForm.get('name')!;
      <div class="jhi-field">
        <label class="form-label" for="field_name" jhiTranslate="peccnssApp.adminAuthority.name">Name</label>
        <input
          type="text"
          class="form-control"
          name="name"
          id="field_name"
          data-cy="name"
          formControlName="name"
          [readonly]="editForm.get('name')!.disabled"
        />
        @if (nameRef.invalid && (nameRef.dirty || nameRef.touched)) {
          <div>
            @if (nameRef.errors?.required) {
              <small class="form-text text-danger" jhiTranslate="entity.validation.required">This field is required.</small>
            }
            @if (nameRef.errors?.maxlength) {
              <small class="form-text text-danger" jhiTranslate="entity.validation.maxlength" [translateValues]="{ max: '50' }"
                >This field cannot be longer than 50 characters.</small
              >
            }
          </div>
        }
      </div>

      <div class="jhi-form-actions">
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-accent"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
