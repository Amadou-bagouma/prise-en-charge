@if (direction(); as directionRef) {
  <div class="pec-ecran">
    <div class="pec-titre-ecran">
      <h1 data-cy="directionDetailsHeading">{{ directionRef.nom }}</h1>
      <span class="pec-num">{{ directionRef.code }}</span>
    </div>

    <jhi-alert-error />
    <jhi-alert />

    <section class="pec-panneau">
      <div class="pec-panneau__tete">
        <span class="pec-panneau__titre">Direction</span>
      </div>
      <div class="pec-panneau__corps">
        <dl class="pec-defs">
          <dt>Code</dt>
          <dd class="pec-defs--mono">{{ directionRef.code || '—' }}</dd>

          <dt>Nom</dt>
          <dd>{{ directionRef.nom || '—' }}</dd>

          <dt>Région</dt>
          <dd>
            @if (directionRef.region) {
              <a [routerLink]="['/region', directionRef.region.id, 'view']">{{ directionRef.region.nom }}</a>
            } @else {
              <span class="pec-muted">—</span>
            }
          </dd>
        </dl>
      </div>
    </section>

    <div class="pec-dossier__actions">
      <button
        type="button"
        [routerLink]="['/direction', directionRef.id, 'edit']"
        class="pec-btn pec-btn--primaire"
        data-cy="entityEditButton"
      >
        <fa-icon class="pec-btn__ico" icon="pencil-alt" />
        <span jhiTranslate="entity.action.edit">Editer</span>
      </button>

      <button
        type="button"
        (click)="previousState()"
        class="pec-btn pec-btn--discret pec-dossier__actions--fin"
        data-cy="entityDetailsBackButton"
      >
        <fa-icon class="pec-btn__ico" icon="arrow-left" />
        <span jhiTranslate="entity.action.back">Retour</span>
      </button>
    </div>
  </div>
}
