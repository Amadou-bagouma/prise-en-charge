<div class="login-page">
  <div class="login-card">
    <!-- Titre -->
    <div class="login-header">
      <h1 data-cy="loginTitle">Connexion à GPEC CNSS</h1>
    </div>

    @if (authenticationError()) {
      <div class="alert alert-danger login-error" data-cy="loginError">Identifiant ou mot de passe incorrect.</div>
    }

    <form class="login-form" (ngSubmit)="login()" [formGroup]="loginForm">
      <!-- Matricule -->
      <div class="input-box matricule-box">
        <input type="text" #username id="username" name="username" placeholder="Matricule" formControlName="username" data-cy="username" />

        <span class="user-icon">👤</span>
      </div>

      <!-- Mot de passe -->
      <div class="input-box password-box">
        <input type="password" id="password" name="password" placeholder="Mot de passe" formControlName="password" data-cy="password" />

        <span class="password-icons">
          <span class="eye-icon">◉</span>
          <span class="lock-icon">🔒</span>
        </span>
      </div>

      <!-- Bouton -->
      <button type="submit" class="login-button" data-cy="submit">Se connecter</button>
    </form>
  </div>
</div>
