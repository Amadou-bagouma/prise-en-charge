<div>
  <div class="jhi-page-header">
    <h2 id="page-heading" data-cy="AuthorityHeading">
      <span jhiTranslate="peccnssApp.adminAuthority.home.title">Authorities</span>
    </h2>

    <div class="jhi-page-actions">
      <button class="btn btn-outline-secondary" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span jhiTranslate="peccnssApp.adminAuthority.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-accent jh-create-entity create-authority"
        [routerLink]="['/authority/new']"
      >
        <fa-icon icon="plus" />
        <span jhiTranslate="peccnssApp.adminAuthority.home.createLabel">Create a new Authority</span>
      </button>
    </div>
  </div>

  <jhi-alert-error />

  <jhi-alert />

  @if (authorities().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span jhiTranslate="peccnssApp.adminAuthority.home.notFound">No Authorities found</span>
    </div>
  } @else {
    <div class="jhi-table-panel table-responsive table-entities" id="entities">
      <table class="table jhi-table" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="name">
              <div class="d-flex">
                <span jhiTranslate="peccnssApp.adminAuthority.name">Name</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (authority of authorities(); track trackName(authority)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/authority', authority.name, 'view']">{{ authority.name }}</a>
              </td>
              <td class="text-end">
                <div ngbDropdown class="d-inline-block" container="body">
                  <button type="button" class="btn btn-secondary btn-sm" ngbDropdownToggle data-cy="entityActionsButton">
                    <fa-icon icon="ellipsis-vertical" />
                    <span class="d-none d-md-inline" jhiTranslate="entity.action.actions">Actions</span>
                  </button>
                  <div ngbDropdownMenu>
                    <a ngbDropdownItem [routerLink]="['/authority', authority.name, 'view']" data-cy="entityDetailsButton">
                      <fa-icon icon="eye" class="me-1" />
                      <span jhiTranslate="entity.action.view">View</span>
                    </a>
                    <button ngbDropdownItem type="button" (click)="delete(authority)" data-cy="entityDeleteButton">
                      <fa-icon icon="times" class="me-1" />
                      <span jhiTranslate="entity.action.delete">Delete</span>
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
