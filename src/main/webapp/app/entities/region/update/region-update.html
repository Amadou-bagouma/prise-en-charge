<div class="d-flex justify-content-center">
  <div class="col-12 col-xl-5">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm" class="jhi-form-panel">
      <h2 id="jhi-region-heading" data-cy="RegionCreateUpdateHeading" jhiTranslate="peccnssApp.region.home.createOrEditLabel">
        Create or edit a Region
      </h2>

      <jhi-alert-error />

      @if (editForm.controls.id.value !== null) {
        <div class="jhi-field mb-3">
          <label class="form-label" for="field_id" jhiTranslate="global.field.id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>
      }

      @let nomRef = editForm.get('nom')!;
      <div class="jhi-field">
        <label class="form-label" for="field_nom" jhiTranslate="peccnssApp.region.nom">Nom</label>
        <input type="text" class="form-control" name="nom" id="field_nom" data-cy="nom" formControlName="nom" />
        @if (nomRef.invalid && (nomRef.dirty || nomRef.touched)) {
          <div>
            @if (nomRef.errors?.required) {
              <small class="form-text text-danger" jhiTranslate="entity.validation.required">This field is required.</small>
            }
          </div>
        }
      </div>

      <div class="jhi-form-actions">
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-accent"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
