<div>
  <div class="jhi-page-header">
    <h2 id="page-heading" data-cy="GestionHeading">
      <span jhiTranslate="peccnssApp.gestion.home.title">Gestions</span>
    </h2>

    <div class="jhi-page-actions">
      <button class="btn btn-outline-secondary" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span jhiTranslate="peccnssApp.gestion.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-accent jh-create-entity create-gestion"
        [routerLink]="['/gestion/new']"
      >
        <fa-icon icon="plus" />
        <span jhiTranslate="peccnssApp.gestion.home.createLabel">Create a new Gestion</span>
      </button>
    </div>
  </div>

  <jhi-alert-error />

  <jhi-alert />

  @if (gestions().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span jhiTranslate="peccnssApp.gestion.home.notFound">No Gestions found</span>
    </div>
  } @else {
    <div class="jhi-table-panel table-responsive table-entities" id="entities">
      <table class="table jhi-table" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="nom">
              <div class="d-flex">
                <span jhiTranslate="peccnssApp.gestion.nom">Nom</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" jhiSortBy="type">
              <div class="d-flex">
                <span jhiTranslate="peccnssApp.gestion.type">Type</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (gestion of gestions(); track trackId(gestion)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/gestion', gestion.id, 'view']">{{ gestion.nom }}</a>
              </td>
              <td>
                <span
                  class="jhi-badge"
                  [ngClass]="'jhi-badge-type-' + gestion.type"
                  [jhiTranslate]="'peccnssApp.TypeGestion.' + (gestion.type ?? 'null')"
                >
                  {{ { null: '', AS: 'AS', OA: 'OA' }[gestion.type ?? 'null'] }}
                </span>
              </td>
              <td class="text-end">
                <div ngbDropdown class="d-inline-block" container="body">
                  <button type="button" class="btn btn-secondary btn-sm" ngbDropdownToggle data-cy="entityActionsButton">
                    <fa-icon icon="ellipsis-vertical" />
                    <span class="d-none d-md-inline" jhiTranslate="entity.action.actions">Actions</span>
                  </button>
                  <div ngbDropdownMenu>
                    <a ngbDropdownItem [routerLink]="['/gestion', gestion.id, 'view']" data-cy="entityDetailsButton">
                      <fa-icon icon="eye" class="me-1" />
                      <span jhiTranslate="entity.action.view">View</span>
                    </a>
                    <a ngbDropdownItem [routerLink]="['/gestion', gestion.id, 'edit']" data-cy="entityEditButton">
                      <fa-icon icon="pencil-alt" class="me-1" />
                      <span jhiTranslate="entity.action.edit">Edit</span>
                    </a>
                    <button ngbDropdownItem type="button" (click)="delete(gestion)" data-cy="entityDeleteButton">
                      <fa-icon icon="times" class="me-1" />
                      <span jhiTranslate="entity.action.delete">Delete</span>
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
  @if (gestions().length > 0) {
    <div>
      <div class="d-flex justify-content-center">
        <jhi-item-count [params]="{ page: page(), totalItems: totalItems(), itemsPerPage: itemsPerPage() }" />
      </div>

      <div class="d-flex justify-content-center">
        <ngb-pagination
          [collectionSize]="totalItems()"
          [page]="page()"
          [pageSize]="itemsPerPage()"
          [maxSize]="5"
          [rotate]="true"
          [boundaryLinks]="true"
          (pageChange)="navigateToPage($event)"
        />
      </div>
    </div>
  }
</div>
